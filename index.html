<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프로필 카드</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #9b59b6 100%);
    }

    .profile-card {
      width: 100%;
      max-width: 380px;
      background-color: #ffffff;
      border-radius: 24px;
      padding: 40px 28px 36px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(36, 16, 66, 0.28);
    }

    .avatar-placeholder {
      width: 124px;
      height: 124px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background-color: #d8dce3;
      border: 4px solid #f1f3f6;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8c95a6;
      font-size: 14px;
      font-weight: 500;
      user-select: none;
    }

    .name {
      font-size: 26px;
      font-weight: 700;
      color: #1f2430;
      margin-bottom: 10px;
      transition: color 0.25s ease, transform 0.25s ease;
      cursor: default;
      display: inline-block;
    }

    .name:hover {
      color: #764ba2;
      transform: translateY(-1px);
    }

    .bio {
      font-size: 15px;
      line-height: 1.6;
      color: #5c6475;
      margin-bottom: 28px;
    }

    .favorites-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8c95a6;
      margin-bottom: 14px;
    }

    .favorites-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .favorite-item {
      background-color: #f6f4fb;
      color: #2d3142;
      font-size: 15px;
      font-weight: 500;
      padding: 11px 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <main class="profile-card">
    <div class="avatar-placeholder" aria-label="프로필 이미지 영역">PHOTO</div>
    <h1 class="name">강윤서</h1>
    <p class="bio">인하대학교 기계공학과 26학번.</p>

    <h2 class="favorites-title">Favorites</h2>
    <ul class="favorites-list">
      <li class="favorite-item"><span>☕</span><span>아이스 아메리카노</span></li>
      <li class="favorite-item"><span>📚</span><span>SF 소설 읽기</span></li>
      <li class="favorite-item"><span>🎧</span><span>로파이 음악 감상</span></li>
    </ul>
  </main>
</body>
</html>
